name: CI

on:
  pull_request:
  push:
    branches: [master]

env:
  DATABASE_URL: postgres://pcaarb:pcaarb@localhost:5432/pcaarb
  # Role restrita usada em runtime pela API (ver migration
  # 0011_app_role_least_privilege) — credencial fixa de dev/CI, nunca usada
  # em produção real (mesmo padrão do POSTGRES_PASSWORD do docker-compose).
  APP_DATABASE_URL: postgres://pcaarb_app:pcaarb_app@localhost:5432/pcaarb
  JWT_ACCESS_SECRET: ci-access-secret-0000000000000000000000
  JWT_REFRESH_SECRET: ci-refresh-secret-0000000000000000000000
  # Nunca usada de verdade: todo teste e2e que dispara envio de e-mail
  # substitui EMAIL_PROVIDER por um fake (ver user-invites.e2e-spec.ts e
  # permissoes-granulares.e2e-spec.ts) — só precisa passar na validação de
  # env (RESEND_API_KEY não-vazia, RESEND_FROM_EMAIL formato de e-mail).
  RESEND_API_KEY: ci-placeholder-nunca-usada
  RESEND_FROM_EMAIL: ci@pcaarb.test

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pcaarb
          POSTGRES_PASSWORD: pcaarb
          POSTGRES_DB: pcaarb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcaarb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Test
        run: pnpm test

      - name: E2E test (API)
        run: pnpm --filter @pcaarb/api test:e2e

      - name: Build
        run: pnpm build
